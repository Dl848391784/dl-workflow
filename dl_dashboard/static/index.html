<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>dl-workflow 控制台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css?v=00ed0b0">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="brand-mark">dl</span>
    <div class="brand-text">
      <h1>dl-workflow 控制台</h1>
      <p>5 阶段工作流 · 跨项目运维面</p>
    </div>
  </div>
  <button id="create-toggle" type="button" class="btn primary">新建工作流</button>
</header>
<form id="create-form" class="create-panel hidden">
  <div class="field">
    <label for="cf-project">项目根路径</label>
    <input id="cf-project" placeholder="/home/admin/projects/xxx" required size="30">
  </div>
  <div class="field">
    <label for="cf-name">工作流名</label>
    <input id="cf-name" placeholder="my_factor_study" required>
  </div>
  <div class="field grow">
    <label for="cf-statement">问题（problem_statement）</label>
    <input id="cf-statement" placeholder="要研究的问题" required size="36">
  </div>
  <button type="submit" class="btn primary">创建并启动</button>
</form>
<div id="banner" class="hidden"></div>
<div class="layout">
  <aside id="sidebar">
    <div class="side-head"><h2>工作流</h2><span id="wf-count" class="count"></span></div>
    <div id="wf-list"><div class="side-empty">连接中…</div></div>
  </aside>
  <main>
    <section id="detail-empty">
      <p>← 从左侧选择一个工作流</p>
    </section>
    <section id="detail-view" class="hidden">
      <div class="section-head"><h2 id="d-title"></h2></div>
      <p id="d-statement"></p>
      <div class="section-head">
        <h3>步骤时间轴</h3><span id="tl-summary" class="hint"></span>
        <span class="tl-switch" id="tl-switch">
          <button type="button" data-skin="metro">地铁</button><button type="button" data-skin="gantt">甘特</button><button type="button" data-skin="cards">卡片树</button>
        </span>
      </div>
      <div id="timeline"></div>
      <div class="section-head"><h3>节点</h3></div>
      <div id="node-strip"></div>
      <div id="interact"></div>
      <div class="section-head"><h3>段明细</h3><span id="seg-count" class="hint"></span></div>
      <div class="table-wrap">
        <table id="seg-table">
          <thead><tr>
            <th>节点</th><th class="num">子步</th><th>kind</th><th class="num">轮数</th>
            <th class="num">耗时(s)</th><th class="num">tok in</th><th class="num">tok out</th>
            <th class="num">成本($)</th><th>时间</th><th>note</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="section-head"><h3>driver 日志</h3><span class="hint">尾部 4KB</span></div>
      <div class="terminal"><pre id="log-tail"></pre></div>
    </section>
  </main>
</div>
<script src="/static/app.js?v=00ed0b0"></script>
</body>
</html>
